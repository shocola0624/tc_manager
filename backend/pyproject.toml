[project]
name = "tc-manager-backend"
version = "0.1.0"
description = "Techspresso for Students - サークル管理アプリ バックエンド"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sheets", "auth", "discord_bot"]
